<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Storage Demo</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 24px;
      }
      .row {
        margin-bottom: 12px;
      }
      label {
        display: inline-block;
        width: 110px;
      }
      input[type="text"] {
        width: 320px;
      }
      button {
        padding: 6px 12px;
      }
      .error {
        color: #c00;
      }
      .ok {
        color: #0a7f2e;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
        margin-top: 16px;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 8px;
      }
      .card img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        background: #f5f5f5;
      }
      .muted {
        color: #666;
        font-size: 12px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h2>Image Upload (Presigned URL)</h2>
    <div class="row">
      <label>Shop ID</label>
      <input id="shopId" type="text" value="demo-shop" />
    </div>
    <div class="row">
      <label>Alt Text</label>
      <input id="altText" type="text" placeholder="optional alt text" />
    </div>
    <div class="row">
      <label>Image File</label>
      <input id="fileInput" type="file" accept="image/*" />
    </div>
    <div class="row">
      <button id="uploadBtn">Upload</button>
      <button id="refreshBtn">Refresh List</button>
    </div>
    <div id="message" class="muted"></div>

    <h3>Images</h3>
    <div id="images" class="grid"></div>

    <script>
      const $ = (id) => document.getElementById(id);

      function setMessage(text, type) {
        const el = $("message");
        el.textContent = text;
        el.className =
          type === "error" ? "error" : type === "ok" ? "ok" : "muted";
      }

      async function preupload(shopId, file, altText) {
        const resp = await fetch("/api/images", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Shop-ID": shopId,
          },
          body: JSON.stringify({
            filename: file.name,
            content_type: file.type || "application/octet-stream",
            alt_text: altText || "",
          }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || "preupload failed");
        return data;
      }

      async function uploadToOSS(uploadURL, method, file) {
        const resp = await fetch(uploadURL, {
          method: method || "PUT",
          headers: {
            "Content-Type": file.type || "application/octet-stream",
          },
          body: file,
        });
        if (!resp.ok) {
          const txt = await resp.text();
          throw new Error("oss upload failed: " + (txt || resp.status));
        }
      }

      async function confirmUpload(shopId, imageId) {
        const resp = await fetch(
          "/api/images/" + encodeURIComponent(imageId) + "/confirm",
          {
            method: "POST",
            headers: {
              "X-Shop-ID": shopId,
            },
          },
        );
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || "confirm upload failed");
        return data;
      }

      async function fetchImages(shopId) {
        const resp = await fetch(
          "/api/images?shop_id=" + encodeURIComponent(shopId),
        );
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || "list failed");
        return data.images || [];
      }

      function renderImages(images) {
        const container = $("images");
        container.innerHTML = "";
        images.forEach((img) => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
          <img src="${img.url}" alt="${img.alt_text || ""}" />
          <div><strong>${img.alt_text || "(no alt text)"}</strong></div>
          <div class="muted">content type：${img.content_type || ""}</div>
          <div class="muted">source：<a href="${img.url || "#"}" target="_blank" rel="noopener noreferrer">查看原图</a></div>
        `;
          container.appendChild(card);
        });
      }

      async function refresh() {
        const shopId = $("shopId").value.trim();
        if (!shopId) {
          setMessage("shop id is required", "error");
          return;
        }
        try {
          const images = await fetchImages(shopId);
          renderImages(images);
          setMessage("loaded " + images.length + " image(s)", "ok");
        } catch (err) {
          setMessage(err.message, "error");
        }
      }

      $("uploadBtn").addEventListener("click", async () => {
        const shopId = $("shopId").value.trim();
        const altText = $("altText").value.trim();
        const file = $("fileInput").files[0];

        if (!shopId) {
          setMessage("shop id is required", "error");
          return;
        }
        if (!file) {
          setMessage("please choose an image file", "error");
          return;
        }

        try {
          setMessage("requesting preupload url...", "muted");
          const pre = await preupload(shopId, file, altText);
          setMessage("uploading file to oss...", "muted");
          await uploadToOSS(pre.upload_url, pre.method, file);
          setMessage("confirming upload...", "muted");
          await confirmUpload(shopId, pre.image_id);
          setMessage("upload success", "ok");
          await refresh();
        } catch (err) {
          setMessage(err.message, "error");
        }
      });

      $("refreshBtn").addEventListener("click", refresh);
      refresh();
    </script>
  </body>
</html>
